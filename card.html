<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="./assets/images/gif/love.gif"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      .product-card {
        width: 500px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0px 0px 20px 5px #d5cff4;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }

      .first-part {
        height: 390px;
        overflow: hidden;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #777099;

        width: 100%;
      }
      #product-img {
        width: 80%;
        height: 300px;
        object-fit: contain;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .fa-heart {
        width: 36px;
        height: 36px;
        border-radius: 100%;
        line-height: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid black;
        position: absolute;
        top: 16px;
        right: 10px;
      }
      .tags p {
        display: inline-block;
        border: 1px solid black;
        padding: 5px 15px;
        border-radius: 5px;
      }

      .second-part {
        width: 95%;
      }
      .heading {
        display: inline-block;
        font-size: 40px;
        font-weight: bold;
        margin: 0;
      }
      .btn {
        display: flex;

        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .addToCart {
        padding: 7px 20px;
        background-color: #777099;
        border: none;
        border-radius: 5px;
        color: white;
        cursor:pointer;
      }
      .price p {
        margin: 0;
        font-size : 25px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="product-card">
      <div class="first-part">
        <img
          src="./assets/images/small-photo/lat-pro-2.jpg"
          id="product-img "
          alt=""
        />
        <i class="fa-regular fa-heart"></i>
      </div>
      <div class="second-part">
        <div class="">
          <p class="heading">Nike Running Shoe</p>
          <div class="tags">
            <p class="size">EU36</p>
            <p class="color">BLACK/WHITE</p>
          </div>
        </div>
        <p class="">
          Lorem ipsum dolor sit amet consectetur, adipisicing elit. Totam, hic
          est inventore expedita tenetur ipsam suscipit quo eaque sunt ad fugit.
        </p>
        <div class="btn">
          <div class="price">
            <span>price</span>
            <p class="">$69.99</p>
          </div>
          <button class="addToCart">Add To Cart</button>
        </div>
      </div>
    </div>
  </body>
</html>
