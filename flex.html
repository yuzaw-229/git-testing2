<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .flex-container {
        display: flex;
        flex-direction: column;
        border: 1px solid black;
        padding: 10px;
        margin: 20px;
        height: 200px;
        align-items: stretch;
      }
      .box {
        /* width: 100px; */
        background: skyblue;
        border: 2px solid blue;
        margin: 5px;
      }
      .container {
        display: flex;
        align-items: baseline;
        border: 3px solid black;
      }

      .big {
        font-size: 50px;
      }

      .medium {
        font-size: 30px;
      }

      .small {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="flex-container">
      <div class="box item-1">item 1</div>
      <div class="box item-2">item 2</div>
      <div class="box item-3">item 3</div>
      <div class="box item-4">item 4</div>
      <div class="box item-5">item 5</div>
    </div>
    <div class="container">
      <div class="box big">Hello</div>
      <div class="box medium">World</div>
      <div class="box small">CSS</div>
    </div>
  </body>
</html>
